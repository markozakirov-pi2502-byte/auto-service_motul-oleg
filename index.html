
<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Auto Service | Ремонт автомобілів</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #111;
            color: white;
            min-height: 100vh;
            padding: 35px 15px;
            position: relative;
        }

        /* Фонове фото */
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background:
                linear-gradient(
                    rgba(0, 0, 0, 0.65),
                    rgba(0, 0, 0, 0.78)
                ),
                url("workshop.png") center 45% / cover no-repeat;
            z-index: -1;
        }

        .container {
            max-width: 680px;
            margin: auto;
            padding: 35px;
            background: rgba(20, 24, 29, 0.93);
            border: 1px solid #555;
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
        }

        h1 {
            text-align: center;
            color: #e5a832;
            font-size: 36px;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #ccc;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin: 18px 0 8px;
            font-weight: bold;
        }

        input, select, textarea {
            width: 100%;
            padding: 14px;
            border: 1px solid #515b66;
            border-radius: 7px;
            background: #111820;
            color: white;
            font-size: 16px;
        }

        input:focus, select:focus, textarea:focus {
            outline: 2px solid #e5a832;
        }

        textarea {
            min-height: 120px;
            resize: vertical;
        }

        button {
            width: 100%;
            padding: 16px;
            margin-top: 25px;
            background: #e5a832;
            color: #111;
            border: none;
            border-radius: 7px;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #ffc34d;
        }

        .info {
            text-align: center;
            margin-top: 25px;
            color: #aaa;
            font-size: 13px;
        }

        .consent {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            margin-top: 18px;
            color: #ccc;
            font-size: 13px;
            font-weight: normal;
        }

        .consent input {
            width: auto;
            margin-top: 2px;
        }

        @media(max-width: 500px) {
            .container {
                padding: 22px 17px;
            }

            h1 {
                font-size: 28px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <h1>AUTO SERVICE</h1>

    <p class="subtitle">
        Ремонт та обслуговування автомобілів
    </p>

    <form
        action="https://formspree.io/f/xrppvavy"
        method="POST"
    >

        <input type="hidden" name="_subject"
        value="Нова заявка з сайту Auto Service">

        <label>Ваше ім'я та прізвище</label>
        <input
            type="text"
            name="name"
            placeholder="Іван Петренко"
            autocomplete="name"
            required
        >

        <label>Номер телефону</label>
        <input
            type="tel"
            name="phone"
            placeholder="+380XXXXXXXXX"
            autocomplete="tel"
            required
        >

        <label>Марка автомобіля</label>
        <input
            type="text"
            name="brand"
            placeholder="Volkswagen"
            required
        >

        <label>Модель автомобіля</label>
        <input
            type="text"
            name="model"
            placeholder="Passat B6"
            required
        >

        <label>Рік випуску</label>
        <input
            type="number"
            name="year"
            placeholder="2008"
            min="1950"
            max="2026"
            required
        >

        <label>Яка послуга вас цікавить?</label>

        <select name="service" required>
            <option value="">Оберіть послугу</option>
            <option>Ремонт ходової</option>
            <option>Заміна ременя ГРМ</option>
            <option>Заміна ланцюга ГРМ</option>
            <option>Заміна мастила та фільтрів</option>
            <option>Діагностика автомобіля</option>
            <option>Інший ремонт</option>
        </select>

        <label>Опишіть проблему автомобіля</label>

        <textarea
            name="problem"
            placeholder="Наприклад: стукає передня підвіска..."
            required
        ></textarea>

        <label class="consent">
            <input type="checkbox" required>
            <span>
                Погоджуюся на обробку моїх контактних
                даних для зв'язку щодо заявки.
            </span>
        </label>

        <button type="submit">
            ВІДПРАВИТИ ЗАЯВКУ
        </button>

    </form>

    <p class="info">
        AUTO SERVICE © 2026<br>
        Ми зв'яжемося з вами для уточнення запису.
    </p>

</div>

</body>
</html>
